server:
  port: 8080

spring:
  application:
    name: finlyhub
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finlyhub}
    username: ${SPRING_DATASOURCE_USERNAME:finlyhub}
    password: ${SPRING_DATASOURCE_PASSWORD:finlyhub_secret_2026}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET:ZHZlcmZhc3RseXNhZmUyNWhlYXZ5bHlvdXJ0b3VnaHRsb25nMTAyNA==}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  upload:
    dir: ${APP_UPLOAD_DIR:uploads}

ai:
  provider: ${AI_PROVIDER:mock}
  retrieval:
    min-similarity: ${AI_RETRIEVAL_MIN_SIMILARITY:0.4}
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o}
  onnx:
    model-uri: ${ONNX_MODEL_URI:https://huggingface.co/BAAI/bge-small-en-v1.5/resolve/main/onnx/model.onnx}
    tokenizer-uri: ${ONNX_TOKENIZER_URI:https://huggingface.co/BAAI/bge-small-en-v1.5/resolve/main/tokenizer.json}

logging:
  level:
    com.finlyhub: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
