databaseChangeLog:
  - changeSet:
      id: V019-1
      author: finlyhub
      comment: Add tsvector search column for hybrid keyword retrieval
      changes:
        - sql:
            sql: >
              ALTER TABLE document_chunks
              ADD COLUMN IF NOT EXISTS search_vector tsvector
              GENERATED ALWAYS AS (to_tsvector('english', content)) STORED

  - changeSet:
      id: V019-2
      author: finlyhub
      comment: Create GIN index on tsvector for fast full-text search
      changes:
        - sql:
            sql: CREATE INDEX IF NOT EXISTS idx_chunks_search_vector ON document_chunks USING GIN (search_vector)
